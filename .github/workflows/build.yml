name: Docker Build Pipeline

on:
  push:
    branches:
      - main

jobs:

  docker-build:

    runs-on: ubuntu-latest

    steps:

    # Download repository code
    - name: Checkout code
      uses: actions/checkout@v4


    # Build Docker image
    - name: Build Docker Image
      run: |
        docker build -t my-website .
        

    # Check image
    - name: List Docker Images
      run: |
        docker images