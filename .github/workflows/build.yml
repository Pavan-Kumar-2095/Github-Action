name: Build and Push Docker Image

on:
  push:
    branches:
      - main


jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4


    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: |
          {
            "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
            "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
            "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
            "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
          }


    - name: Login to ACR
      run: |
        az acr login --name ${{ secrets.ACR_NAME }}


    - name: Build Docker Image
      run: |
        docker build \
        -t ${{ secrets.ACR_NAME }}.azurecr.io/my-website:${{ github.sha }} .


    - name: Push Image to ACR
      run: |
        docker push \
        ${{ secrets.ACR_NAME }}.azurecr.io/my-website:${{ github.sha }}
    
    - name: Deploy ACI
      run: |    
        az container create \
          --resource-group ${{ secrets.RESOURCE_GROUP }} \
          --name ${{ secrets.ACI_NAME }} \
          --image ${{ secrets.ACR_LOGIN_SERVER }}/my-website:${{ github.sha }} \
          --registry-login-server ${{ secrets.ACR_LOGIN_SERVER }} \
          --registry-username ${{ secrets.ACR_USERNAME }} \
          --registry-password ${{ secrets.ACR_PASSWORD }} \
          --dns-name-label my-website-demo \
          --ports 80 \
          --os-type Linux \
          --cpu 1 \
          --memory 1 \
          --restart-policy Always